name: Deploy Services

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  YARN_VERSION: '1.22.22'

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      shared-sdk: ${{ steps.changes.outputs.shared-sdk }}
      infrastructure: ${{ steps.changes.outputs.infrastructure }}
      clients: ${{ steps.changes.outputs.clients }}
      all-services: ${{ steps.all-services.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            shared-sdk:
              - 'shared/sdk/**'
            infrastructure:
              - 'infrastructure/**'
            clients:
              - 'clients/**'
            services:
              - 'services/**'
            authentication:
              - 'services/authentication/**'
            chat:
              - 'services/chat/**'
            credentials:
              - 'services/credentials/**'
            data-sources:
              - 'services/data-sources/**'
            executions:
              - 'services/executions/**'
            users:
              - 'services/users/**'
            websocket:
              - 'services/websocket/**'

      - name: Determine services to deploy
        id: all-services
        run: |
          services=()
          
          # If shared SDK changed, deploy all services
          if [[ "${{ steps.changes.outputs.shared-sdk }}" == "true" ]]; then
            echo "Shared SDK changed, deploying all services"
            services=("authentication" "chat" "credentials" "data-sources" "executions" "users" "websocket")
          else
            # Only deploy services that have changes
            if [[ "${{ steps.changes.outputs.authentication }}" == "true" ]]; then
              services+=("authentication")
            fi
            if [[ "${{ steps.changes.outputs.chat }}" == "true" ]]; then
              services+=("chat")
            fi
            if [[ "${{ steps.changes.outputs.credentials }}" == "true" ]]; then
              services+=("credentials")
            fi
            if [[ "${{ steps.changes.outputs.data-sources }}" == "true" ]]; then
              services+=("data-sources")
            fi
            if [[ "${{ steps.changes.outputs.executions }}" == "true" ]]; then
              services+=("executions")
            fi
            if [[ "${{ steps.changes.outputs.users }}" == "true" ]]; then
              services+=("users")
            fi
            if [[ "${{ steps.changes.outputs.websocket }}" == "true" ]]; then
              services+=("websocket")
            fi
          fi
          
          # Convert array to JSON format
          services_json=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s .)
          echo "services=$services_json" >> $GITHUB_OUTPUT
          
          echo "Services to deploy: ${services[*]}"

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services == 'true' || needs.detect-changes.outputs.shared-sdk == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared SDK
        if: needs.detect-changes.outputs.shared-sdk == 'true'
        run: yarn turbo run build --filter='@zeiro/sdk'

      - name: Build CLI
        run: yarn install-cli

      - name: Type check
        run: yarn check-types

      - name: Lint
        run: yarn lint

      - name: Run tests
        run: yarn turbo run test --filter='./services/*'

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.infrastructure == 'true' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"

      - name: Deploy Platform Infrastructure
        working-directory: infrastructure/platform
        run: |
          terraform init
          terraform plan
          terraform apply -auto-approve

      - name: Deploy Network Infrastructure
        working-directory: infrastructure/network
        run: |
          terraform init
          terraform plan
          terraform apply -auto-approve

  deploy-services:
    name: Deploy Services
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test, deploy-infrastructure]
    if: always() && needs.build-and-test.result == 'success' && (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped') && github.ref == 'refs/heads/main'
    environment: production
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.all-services) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared SDK
        run: yarn turbo run build --filter='@zeiro/sdk'

      - name: Build CLI
        run: yarn install-cli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"

      - name: Deploy ${{ matrix.service }} service
        working-directory: services/${{ matrix.service }}
        run: |
          # Install Serverless Framework
          npm install -g serverless@3
          
          # Generate environment variables
          if [ -f "scripts/generate-env.ts" ]; then
            yarn ts-node scripts/generate-env.ts
          fi
          
          # Deploy using Zeiro CLI
          ../../shared/cli/dist/index.js deploy --stage prod

  deploy-clients:
    name: Deploy Clients
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.clients == 'true' && github.ref == 'refs/heads/main'
    environment: production
    strategy:
      matrix:
        client: [dashboard, marketing]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build ${{ matrix.client }} client
        run: yarn turbo run build --filter='./clients/${{ matrix.client }}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ${{ matrix.client }} to AWS Amplify
        working-directory: clients/${{ matrix.client }}
        run: |
          # This would typically involve deploying to AWS Amplify
          # The exact deployment method would depend on your Amplify setup
          echo "Deploying ${{ matrix.client }} client"
          # Add your client deployment commands here

  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: needs.build-and-test.result == 'success' && github.ref == 'refs/heads/develop'
    environment: development
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.all-services) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared SDK
        run: yarn turbo run build --filter='@zeiro/sdk'

      - name: Build CLI
        run: yarn install-cli

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.0"

      - name: Deploy ${{ matrix.service }} service to dev
        working-directory: services/${{ matrix.service }}
        run: |
          # Install Serverless Framework
          npm install -g serverless@3
          
          # Generate environment variables for dev
          if [ -f "scripts/generate-env.ts" ]; then
            yarn ts-node scripts/generate-env.ts --stage dev
          fi
          
          # Deploy using Zeiro CLI to dev stage
          ../../shared/cli/dist/index.js deploy --stage dev

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-services, deploy-clients, deploy-dev]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Deployment Success
        if: needs.deploy-services.result == 'success' || needs.deploy-services.result == 'skipped'
        run: |
          echo "✅ Deployment completed successfully"
          
      - name: Deployment Failed
        if: needs.deploy-services.result == 'failure'
        run: |
          echo "❌ Deployment failed"
          exit 1
